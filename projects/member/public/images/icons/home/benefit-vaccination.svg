<svg width="30" height="30" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vaccination: a syringe in the handoff's two-tone line style
       (#00000F outline, #64C0FF accent). -->
  <g transform="rotate(-45 256 256)" stroke="#00000F" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- dose -->
    <rect x="232" y="206" width="124" height="100" rx="10" fill="#64C0FF" stroke="none"/>
    <!-- barrel -->
    <rect x="124" y="186" width="244" height="140" rx="22"/>
    <!-- graduations -->
    <path d="M172 186v44M214 186v44M256 186v44"/>
    <!-- plunger: flange, rod, thumb rest -->
    <path d="M124 156v200M124 256H36M36 198v116"/>
    <!-- hub and needle -->
    <path d="M368 226h40v60h-40M408 256h84"/>
  </g>
  <!-- a drop off the needle tip, and the sparkle the vision icon carries -->
  <path d="M462 30c17 23 27 38 27 50a27 27 0 0 1-54 0c0-12 10-27 27-50z" fill="#64C0FF"/>
  <path d="M100 66l13 31 31 13-31 13-13 31-13-31-31-13 31-13z" fill="#64C0FF"/>
</svg>
